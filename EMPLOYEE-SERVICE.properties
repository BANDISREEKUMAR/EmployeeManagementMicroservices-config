
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Resilient4J Configurations

resilience4j.circuitbreaker.instances.departmentService.register-health-indicator=true
resilience4j.circuitbreaker.instances.departmentService.sliding-window-type=count-based
resilience4j.circuitbreaker.instances.departmentService.sliding-window-size=5
resilience4j.circuitbreaker.instances.departmentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.departmentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.departmentService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.departmentService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.departmentService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.timelimiter.instances.departmentService.timeout-duration=3s
resilience4j.circuitbreaker.instances.departmentService.record-exceptions=\
  org.springframework.web.reactive.function.client.WebClientResponseException,\
  org.springframework.web.reactive.function.client.WebClientRequestException,\
  java.lang.Exception

# 1. Expose Actuator Web Endpoints
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents

# 2. Show detailed health status (UP, DOWN, CIRCUIT_OPEN, etc.)
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

# 3. Register Resilience4j metrics with Actuator/Micrometer
resilience4j.circuitbreaker.instances.departmentService.register-health-indicator=true
resilience4j.retry.instances.departmentService.register-health-indicator=true
